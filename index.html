<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adinnova Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --orange: #e8622a;
      --orange-dark: #d95c10;
      --bg: #ecddd0;
      --card-bg: #f0e4d4;
      --text-dark: #1a1a1a;
      --text-mid: #5c4a3a;
      --text-light: #9a8272;
      --poly: linear-gradient(140deg, #d6c698, #bba870, #cfc090);
      --ring-color: #ddd2c4;
    }

    html { font-size: 16px; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg);
      overflow-x: hidden;
      position: relative;
    }

    /* ── Background decorations ── */
    .circle {
      position: fixed;
      border-radius: 50%;
      z-index: 0;
      background: var(--orange);
      pointer-events: none;
    }
    .c1 { width: clamp(120px, 30vw, 220px); height: clamp(120px, 30vw, 220px); top: clamp(-60px, -10vw, -85px); right: clamp(-50px, -10vw, -75px); }
    .c2 { width: clamp(100px, 22vw, 170px); height: clamp(100px, 22vw, 170px); bottom: clamp(60px, 12vh, 100px); left: clamp(-45px, -8vw, -65px); }
    .c3 { width: clamp(70px, 15vw, 110px); height: clamp(70px, 15vw, 110px); bottom: clamp(-30px, -5vw, -40px); left: clamp(20px, 5vw, 40px); }

    .poly {
      position: fixed;
      z-index: 0;
      background: var(--poly);
      pointer-events: none;
    }
    .p1 {
      top: clamp(100px, 20vh, 155px); left: clamp(6px, 2vw, 12px);
      width: clamp(48px, 8vw, 72px); height: clamp(48px, 8vw, 72px);
      clip-path: polygon(50% 0%,100% 38%,80% 100%,20% 100%,0% 38%);
    }
    .p2 {
      bottom: clamp(50px, 10vh, 75px); right: clamp(10px, 2.5vw, 18px);
      width: clamp(55px, 9vw, 85px); height: clamp(55px, 9vw, 85px);
      clip-path: polygon(50% 0%,100% 38%,80% 100%,20% 100%,0% 38%);
    }
    .p3 {
      bottom: clamp(150px, 25vh, 230px); left: clamp(4px, 1.5vw, 8px);
      width: clamp(32px, 5vw, 48px); height: clamp(32px, 5vw, 48px);
      clip-path: polygon(50% 0%,100% 38%,80% 100%,20% 100%,0% 38%);
      opacity: 0.7;
    }

    .ring {
      position: fixed;
      top: clamp(140px, 22vh, 210px); right: clamp(12px, 3vw, 20px);
      width: clamp(34px, 6vw, 50px); height: clamp(34px, 6vw, 50px);
      border-radius: 50%;
      border: clamp(9px, 2vw, 14px) solid var(--ring-color);
      z-index: 0;
      pointer-events: none;
    }

    .arc {
      position: fixed;
      left: clamp(-90px, -15vw, -110px); top: 50%;
      transform: translateY(-50%);
      width: clamp(200px, 35vw, 280px); height: clamp(200px, 35vw, 280px);
      border-radius: 50%;
      border: 1px solid rgba(150,120,90,0.18);
      z-index: 0;
      pointer-events: none;
    }

    .dots {
      position: fixed;
      top: clamp(16px, 3vh, 28px); left: clamp(14px, 3vw, 24px);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: clamp(5px, 1vw, 7px);
      z-index: 0;
      pointer-events: none;
    }
    .dots b {
      display: block;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(130,95,65,0.28);
    }

    .dots-tr {
      position: fixed;
      top: clamp(16px, 3vh, 26px); right: clamp(60px, 12vw, 90px);
      display: flex;
      gap: 5px;
      z-index: 0;
      pointer-events: none;
    }
    .dots-tr b {
      display: block;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(130,95,65,0.25);
    }

    /* ── Page layout ── */
    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(40px, 8vh, 70px) clamp(20px, 6vw, 36px) clamp(36px, 6vh, 56px);
    }

    /* ── Logo ── */
    .logo-slot {
      width: 100%;
      max-width: clamp(180px, 55vw, 300px);
      min-height: clamp(60px, 12vh, 100px);
      margin-bottom: clamp(16px, 3vh, 26px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-slot img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ── Tagline ── */
    .tagline {
      font-size: clamp(9px, 2.2vw, 11px);
      font-weight: 700;
      letter-spacing: clamp(3px, 1vw, 5px);
      color: var(--orange-dark);
      text-align: center;
      margin-bottom: clamp(8px, 2vh, 12px);
    }

    /* ── Dot divider ── */
    .dot-div {
      display: flex;
      align-items: center;
      gap: clamp(6px, 2vw, 10px);
      margin-bottom: clamp(14px, 2.5vh, 20px);
    }
    .dot-div em {
      display: block;
      width: clamp(36px, 10vw, 55px); height: 1px;
      background: var(--orange-dark);
      opacity: 0.45;
    }
    .dot-div s {
      display: block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--orange-dark);
      text-decoration: none;
    }

    /* ── Description ── */
    .desc {
      text-align: center;
      color: var(--text-mid);
      font-size: clamp(12px, 3.2vw, 14px);
      font-weight: 400;
      line-height: 1.85;
      margin-bottom: clamp(28px, 6vh, 44px);
      max-width: clamp(220px, 70vw, 300px);
    }

    /* ── Cards ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 2.5vh, 16px);
    }

    .link-card {
      width: 100%;
      text-decoration: none;
      background: var(--card-bg);
      border-radius: 60px;
      padding: clamp(6px, 1.5vh, 9px) clamp(16px, 4vw, 26px) clamp(6px, 1.5vh, 9px) clamp(6px, 1.5vh, 9px);
      display: flex;
      align-items: center;
      box-shadow:
        0 4px 14px rgba(100,60,20,0.10),
        0 1px 4px  rgba(100,60,20,0.07);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .link-card:hover,
    .link-card:focus {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(100,60,20,0.16);
      outline: none;
    }
    .link-card:active {
      transform: translateY(-1px);
    }

    /* Icon circle */
    .ic {
      width: clamp(44px, 12vw, 58px);
      height: clamp(44px, 12vw, 58px);
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(200,175,150,0.2);
    }
    .ic img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Vertical separator */
    .sep {
      width: 1px;
      height: 30px;
      background: rgba(160,120,80,0.28);
      margin: 0 clamp(12px, 3.5vw, 20px);
      flex-shrink: 0;
    }

    /* Label */
    .lbl {
      flex: 1;
      font-size: clamp(12px, 3.2vw, 15px);
      font-weight: 800;
      letter-spacing: clamp(1px, 0.5vw, 2px);
      color: var(--text-dark);
    }

    /* Arrow */
    .arr {
      font-size: clamp(16px, 4vw, 20px);
      color: var(--orange-dark);
      line-height: 1;
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .link-card:hover .arr { transform: translateX(5px); }

    /* ── Footer ── */
    footer {
      margin-top: clamp(32px, 6vh, 50px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 2vh, 12px);
    }
    .ft-line {
      width: 60px; height: 1px;
      background: var(--orange-dark);
      opacity: 0.38;
    }
    footer p {
      font-size: clamp(9px, 2.2vw, 11px);
      color: var(--text-light);
      text-align: center;
    }

    /* ── Tablet (601px – 900px) ── */
    @media (min-width: 601px) {
      .page {
        padding: 70px 48px 56px;
      }
      .logo-slot {
        max-width: 260px;
      }
    }

    /* ── Desktop (901px+) ── */
    @media (min-width: 901px) {
      .page {
        max-width: 560px;
        padding: 80px 40px 64px;
      }
      .logo-slot {
        max-width: 300px;
      }
      .desc {
        max-width: 320px;
      }
    }

    /* ── Very small phones (< 360px) ── */
    @media (max-width: 359px) {
      .tagline {
        letter-spacing: 2px;
      }
      .sep {
        margin: 0 10px;
      }
    }

    /* ── Landscape mobile ── */
    @media (max-height: 500px) and (orientation: landscape) {
      .page {
        justify-content: flex-start;
        padding-top: 30px;
        padding-bottom: 30px;
      }
      .logo-slot {
        min-height: 50px;
        max-width: 160px;
        margin-bottom: 10px;
      }
      .tagline { margin-bottom: 6px; }
      .dot-div { margin-bottom: 8px; }
      .desc { margin-bottom: 16px; }
      .links { gap: 8px; }
      footer { margin-top: 20px; }
      /* Hide heavy bg decorations in landscape to avoid clutter */
      .arc, .p3 { display: none; }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      .link-card, .arr { transition: none; }
    }
  </style>
</head>
<body>

  <!-- Background decoration -->
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>
  <div class="poly p1"></div>
  <div class="poly p2"></div>
  <div class="poly p3"></div>
  <div class="ring"></div>
  <div class="arc"></div>
  <div class="dots">
    <b></b><b></b><b></b><b></b><b></b><b></b>
    <b></b><b></b><b></b><b></b><b></b><b></b>
    <b></b><b></b><b></b><b></b><b></b><b></b>
    <b></b><b></b><b></b><b></b><b></b><b></b>
    <b></b><b></b><b></b><b></b><b></b><b></b>

  <main class="page">

    <div class="logo-slot">

    <div class="tagline">CREATIVE. DIGITAL. INNOVATIVE.</div>

    <div class="dot-div">
      <em></em><s></s><em></em>
    </div>

    <p class="desc">
      Votre marque mérite mieux que l'ordinaire&nbsp;—&nbsp;on est là pour ça.
    </p>

    <div class="links">

      <a class="link-card" href="https://www.instagram.com/adinnova.agency/" target="_blank" rel="noopener noreferrer">
        <div class="ic"><img src="Instagram_logo_2022.svg" alt="Instagram"></div>
        <div class="sep"></div>
        <div class="lbl">INSTAGRAM</div>
        <div class="arr">&#8594;</div>

      <a class="link-card" href="https://www.facebook.com/profile.php?id=61569210123634" target="_blank" rel="noopener noreferrer">
        <div class="ic"><img src="2023_Facebook_icon.svg" alt="Facebook"></div>
        <div class="sep"></div>

      <a class="link-card" href="https://www.tiktok.com/@adinnova.agency" target="_blank" rel="noopener noreferrer">
        <div class="ic"><img src="Tiktok_icon.svg" alt="TikTok"></div>

    <footer>
      <div class="ft-line"></div>

    </footer>

  </main>

</body>
</html>
