<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adinnova Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background-color: #ecddd0;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Orange circles ── */
    .circle {
      position: fixed;
      border-radius: 50%;
      z-index: 0;
      background: #e8622a;
    }
    .c1 { width: 220px; height: 220px; top: -85px;  right: -75px; }
    .c2 { width: 170px; height: 170px; bottom: 100px; left: -65px; }
    .c3 { width: 110px; height: 110px; bottom: -40px; left: 40px;  }

    /* ── Low-poly diamond shapes ── */
    .poly {
      position: fixed;
      z-index: 0;
      background: linear-gradient(140deg, #d6c698, #bba870, #cfc090);
    }
    .p1 {
      top: 155px; left: 12px;
      width: 72px; height: 72px;
      clip-path: polygon(50% 0%,100% 38%,80% 100%,20% 100%,0% 38%);
    }
    .p2 {
      bottom: 75px; right: 18px;
      width: 85px; height: 85px;
      clip-path: polygon(50% 0%,100% 38%,80% 100%,20% 100%,0% 38%);
    }
    .p3 {
      bottom: 230px; left: 8px;
      width: 48px; height: 48px;
      clip-path: polygon(50% 0%,100% 38%,80% 100%,20% 100%,0% 38%);
      opacity: 0.7;
    }

    /* ── White/cream torus ring ── */
    .ring {
      position: fixed;
      top: 210px; right: 20px;
      width: 50px; height: 50px;
      border-radius: 50%;
      border: 14px solid #ddd2c4;
      z-index: 0;
    }

    /* ── Curved arc line ── */
    .arc {
      position: fixed;
      left: -110px; top: 50%;
      transform: translateY(-50%);
      width: 280px; height: 280px;
      border-radius: 50%;
      border: 1px solid rgba(150,120,90,0.18);
      z-index: 0;
    }

    /* ── Dot grid ── */
    .dots {
      position: fixed;
      top: 28px; left: 24px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      z-index: 0;
    }
    .dots b {
      display: block;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(130,95,65,0.28);
    }

    /* ── Three dots top-right area ── */
    .dots-tr {
      position: fixed;
      top: 26px; right: 90px;
      display: flex;
      gap: 5px;
      z-index: 0;
    }
    .dots-tr b {
      display: block;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: rgba(130,95,65,0.25);
    }

    /* ── Page layout ── */
    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 28px 50px;
    }

    /* ── Logo slot ── */
    .logo-slot {
      width: 100%;
      max-width: 300px;
      min-height: 100px;
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-slot img { width: 100%; height: auto; display: block; }

    /* ── Tagline ── */
    .tagline {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #d95c10;
      text-align: center;
      margin-bottom: 12px;
    }

    /* ── Dot divider ── */
    .dot-div {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .dot-div em {
      display: block;
      width: 55px; height: 1px;
      background: #d95c10;
      opacity: 0.45;
    }
    .dot-div s {
      display: block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #d95c10;
      text-decoration: none;
    }

    /* ── Description ── */
    .desc {
      text-align: center;
      color: #5c4a3a;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.85;
      margin-bottom: 44px;
      max-width: 300px;
    }

    /* ── Cards ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-card {
      width: 100%;
      text-decoration: none;
      background: #f0e4d4;
      border-radius: 60px;
      padding: 9px 26px 9px 9px;
      display: flex;
      align-items: center;
      box-shadow:
        0 4px 14px rgba(100,60,20,0.10),
        0 1px 4px  rgba(100,60,20,0.07);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .link-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(100,60,20,0.16);
    }

    /* Icon circle */
    .ic {
      width: 58px; height: 58px;
      border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(200,175,150,0.2);
    }
    .ic img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Vertical separator */
    .sep {
      width: 1px;
      height: 30px;
      background: rgba(160,120,80,0.28);
      margin: 0 20px;
      flex-shrink: 0;
    }

    /* Label */
    .lbl {
      flex: 1;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #1a1a1a;
    }

    /* Arrow */
    .arr {
      font-size: 20px;
      color: #d95c10;
      line-height: 1;
      transition: transform 0.2s ease;
    }
    .link-card:hover .arr { transform: translateX(5px); }

    /* ── Footer ── */
    footer {
      margin-top: 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .ft-line {
      width: 60px; height: 1px;
      background: #d95c10;
      opacity: 0.38;
    }
    footer p {
      font-size: 11px;
      color: #9a8272;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Background decoration -->
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>
  <div class="poly p1"></div>
  <div class="poly p2"></div>
  <div class="poly p3"></div>
  <div class="ring"></div>
  <div class="arc"></div>
  <div class="dots">
    <b></b><b></b><b></b><b></b><b></b><b></b>
    <b></b><b></b><b></b><b></b><b></b><b></b>
    <b></b><b></b><b></b><b></b><b></b><b></b>
    <b></b><b></b><b></b><b></b><b></b><b></b>
    <b></b><b></b><b></b><b></b><b></b><b></b>
    <b></b><b></b><b></b><b></b><b></b><b></b>
  </div>
  <div class="dots-tr">
    <b></b><b></b><b></b><b></b>
  </div>

  <main class="page">

    <!-- ✏️ DROP YOUR LOGO HERE -->
    <div class="logo-slot">
      <img src="qualskills new logo (1) (2).png" alt="Adinnova Agency">
    </div>

    <div class="tagline">CREATIVE. DIGITAL. INNOVATIVE.</div>

    <div class="dot-div">
      <em></em><s></s><em></em>
    </div>

    <p class="desc">
      Votre marque mérite mieux que l'ordinaire <br>on est là pour ça.
    </p>

    <div class="links">

      <!-- ✏️ DROP YOUR INSTAGRAM ICON inside .ic -->
      <a class="link-card" href="https://www.instagram.com/adinnova.agency/" target="_blank">
        <div class="ic"><img src="Instagram_logo_2022.svg" alt="Instagram"></div>
        <div class="sep"></div>
        <div class="lbl">INSTAGRAM</div>
        <div class="arr">&#8594;</div>
      </a>

      <!-- ✏️ DROP YOUR FACEBOOK ICON inside .ic -->

        <div class="ic"><img src="2023_Facebook_icon.svg" alt="Facebook"></div>
        <div class="sep"></div>
        <div class="lbl">FACEBOOK</div>

      <!-- ✏️ DROP YOUR TIKTOK ICON inside .ic -->

    <footer>

      <p>&copy; 2026 Adinnova Agency. All Rights Reserved.</p>

  </main>

</body>
</html>
